name: Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # Create releases and commit version bumps
  issues: write # Comment on resolved issues
  pull-requests: write # Comment on merged PRs
  id-token: write # Generate OIDC token for npm trusted publishing

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Run Biome CI
        run: npm run check:ci

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Knip
        run: npm run knip

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check generated tool docs
        run: npm run docs:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci

      - name: Install Radicale
        run: pip install radicale

      - name: Configure Radicale
        run: |
          mkdir -p "$RUNNER_TEMP/radicale/collections"
          printf 'test:test\n' > "$RUNNER_TEMP/radicale/htpasswd"

      - name: Start Radicale
        run: |
          radicale \
            --storage-filesystem-folder "$RUNNER_TEMP/radicale/collections" \
            --auth-type htpasswd \
            --auth-htpasswd-filename "$RUNNER_TEMP/radicale/htpasswd" \
            --auth-htpasswd-encryption plain \
            --server-hosts 127.0.0.1:5232 &
          for _ in $(seq 1 30); do
            curl -fsS -u test:test http://127.0.0.1:5232/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "Radicale failed to start" >&2
          exit 1

      - name: Create test address book
        run: |
          curl -fsS -X MKCOL -u test:test \
            -H "Content-Type: application/xml" \
            --data '<?xml version="1.0" encoding="utf-8" ?>
              <create xmlns="DAV:" xmlns:CR="urn:ietf:params:xml:ns:carddav">
                <set><prop>
                  <resourcetype><collection/><CR:addressbook/></resourcetype>
                  <displayname>Test</displayname>
                </prop></set>
              </create>' \
            http://127.0.0.1:5232/test/contacts/

      - name: Run smoke
        run: |
          cat > .env <<EOF
          CARDDAV_BASE_URL=http://127.0.0.1:5232
          CARDDAV_USERNAME=test
          CARDDAV_PASSWORD=test
          EOF
          npm run smoke

  release:
    needs: [test, knip, docs, smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # semantic-release defaults the very first release to 1.0.0. Seeding a
      # v0.0.0 baseline tag on the root commit makes the initial feat commits
      # produce 0.1.0 instead. No-op once any v* tag exists.
      - name: Seed v0.0.0 baseline tag for the first release
        run: |
          git fetch --tags --quiet
          if [ -z "$(git tag -l 'v*')" ]; then
            root=$(git rev-list --max-parents=0 HEAD | tail -n1)
            git tag v0.0.0 "$root"
            git push origin v0.0.0
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Record existing release tags
        run: git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-before"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: "0"
      # The tag semantic-release just created, if any. Comparing against the
      # tags from before the run keeps re-runs from re-announcing a release.
      - name: Detect published version
        id: released
        run: |
          tag=$(git tag --list 'v*' | sort | comm -13 "$RUNNER_TEMP/tags-before" - | head -n1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The GitHub Release above is created with GITHUB_TOKEN, which does not
  # trigger publish-mcp-registry.yml's `release` event, so call it here.
  mcp-registry:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      version: ${{ needs.release.outputs.version }}
